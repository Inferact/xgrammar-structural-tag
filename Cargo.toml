[package]
name = "xgrammar-structural-tag"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust builders for xgrammar structural_tag tool-calling constraints"
repository = "https://github.com/Inferact/xgrammar-structural-tag"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"

[dev-dependencies]
expect-test = "1.5"

[lints.rust]
missing_docs = "deny"

