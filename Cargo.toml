[package]
name = "xgrammar-structural-tag"
version = "0.2.0+xgrammar.0.2.4.dd729e7"
edition = "2024"
rust-version = "1.85"
authors = ["Bugen Zhao <i@bugenzhao.com>"]
license = "Apache-2.0"
description = "Rust builders for xgrammar structural_tag tool-calling constraints"
repository = "https://github.com/Inferact/xgrammar-structural-tag"
documentation = "https://docs.rs/xgrammar-structural-tag"
keywords = ["xgrammar", "llm", "tool-calling", "json-schema", "structured-output"]
publish = true

[dependencies]
auto_impl = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"
expect-test = "1.5"

[[bench]]
name = "structural_tag"
harness = false

[lints.rust]
missing_docs = "deny"
