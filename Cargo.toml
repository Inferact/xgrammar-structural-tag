[package]
name = "xgrammar-structural-tag"
version = "0.1.0+xgrammar.0.2.2.4d145cc"
edition = "2024"
license = "Apache-2.0"
description = "Rust builders for xgrammar structural_tag tool-calling constraints"
repository = "https://github.com/Inferact/xgrammar-structural-tag"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"

[dev-dependencies]
criterion = "0.5"
expect-test = "1.5"

[[bench]]
name = "structural_tag"
harness = false

[lints.rust]
missing_docs = "deny"
